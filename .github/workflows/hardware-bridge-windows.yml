name: Build Windows hardware companion

on:
  workflow_dispatch:
  push:
    tags:
      - "hardware-bridge-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Arduino CLI
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "arduino-cli.zip"
          Invoke-WebRequest -Uri "https://downloads.arduino.cc/arduino-cli/arduino-cli_latest_Windows_64bit.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath (Join-Path $env:RUNNER_TEMP "arduino-cli") -Force
          New-Item -ItemType Directory -Force -Path "backend/arduino-cli" | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "arduino-cli/arduino-cli.exe") "backend/arduino-cli/arduino-cli.exe"

      - name: Install bridge dependencies and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: Package companion
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name KaktusHardwareBridge --paths backend --add-binary "backend/arduino-cli/arduino-cli.exe;arduino-cli" --collect-all google.auth --collect-all google.oauth2 --collect-all google.auth.transport --collect-all requests --collect-all urllib3 --collect-all certifi --collect-all idna --collect-all charset_normalizer --collect-all serial --collect-all uvicorn companion/hardware_agent.py

      - name: Check packaged companion dependencies
        shell: pwsh
        run: |
          & "dist/KaktusHardwareBridge.exe" --self-check
          if ($LASTEXITCODE -ne 0) {
            $log = Join-Path $env:APPDATA "Kaktus/HardwareBridge/agent.log"
            if (Test-Path $log) { Get-Content $log }
            throw "The packaged companion could not load its hardware dependencies."
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          & $compiler "companion/KaktusHardwareBridge.iss"

      - name: Sign Windows binaries when a trusted certificate is configured
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERTIFICATE_BASE64 -or -not $env:SIGNING_CERTIFICATE_PASSWORD) {
            Write-Output "No protected signing certificate configured; publishing an unsigned installer."
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP "kaktus-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw "Windows SDK signtool.exe was not found." }
          foreach ($file in @("dist/KaktusHardwareBridge.exe", "dist/KaktusHardwareBridgeSetup.exe")) {
            & $signTool sign /f $certificate /p $env:SIGNING_CERTIFICATE_PASSWORD /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 $file
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $file." }
          }
          Remove-Item -LiteralPath $certificate -Force

      - uses: actions/upload-artifact@v4
        with:
          name: KaktusHardwareBridgeSetup
          path: dist/KaktusHardwareBridgeSetup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged installer
        if: startsWith(github.ref, 'refs/tags/hardware-bridge-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Kaktus Hardware Bridge ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/KaktusHardwareBridgeSetup.exe
