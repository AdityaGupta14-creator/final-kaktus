<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Donut slices with subtle shadow -->
  <g filter="url(#softShadow)">
    <path d="M 460.00 90.00 A 160 160 0 1 1 365.95 379.44 L 404.16 326.86 A 95 95 0 1 0 460.00 155.00 Z" fill="#16a34a" />
    <path d="M 365.95 379.44 A 160 160 0 0 1 330.56 155.95 L 383.14 194.16 A 95 95 0 0 0 404.16 326.86 Z" fill="#d97706" />
    <path d="M 330.56 155.95 A 160 160 0 0 1 460.00 90.00 L 460.00 155.00 A 95 95 0 0 0 383.14 194.16 Z" fill="#475569" />
  </g>

  <!-- Center Hole Typography -->
  <g transform="translate(460, 250)" text-anchor="middle">
    <text y="-10" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">USE OF FUNDS</text>
    <text y="24" font-size="32" font-weight="800" fill="#0f172a" letter-spacing="-0.5">18 Mo</text>
    <text y="44" font-size="12.5" font-weight="500" fill="#64748b">Runway</text>
  </g>

  <!-- 1. Engineering Callout (Right side) -->
  <g transform="translate(650, 200)">
    <text x="0" y="0" font-size="24" font-weight="800" fill="#16a34a">60%</text>
    <text x="0" y="22" font-size="15" font-weight="700" fill="#1e293b">Core Engineering</text>
    <text x="0" y="42" font-size="12.5" font-weight="400" fill="#64748b">Simulation, Rules Engine &amp; Wasm</text>
  </g>

  <!-- 2. GTM Callout (Left side bottom) -->
  <g transform="translate(260, 390)" text-anchor="end">
    <text x="0" y="0" font-size="24" font-weight="800" fill="#d97706">25%</text>
    <text x="0" y="22" font-size="15" font-weight="700" fill="#1e293b">Developer GTM</text>
    <text x="0" y="42" font-size="12.5" font-weight="400" fill="#64748b">DevRel, Community &amp; Docs</text>
  </g>

  <!-- 3. Operations Callout (Left side top) -->
  <g transform="translate(260, 110)" text-anchor="end">
    <text x="0" y="0" font-size="24" font-weight="800" fill="#475569">15%</text>
    <text x="0" y="22" font-size="15" font-weight="700" fill="#1e293b">Infra &amp; Operations</text>
    <text x="0" y="42" font-size="12.5" font-weight="400" fill="#64748b">Cloud Servers, Legal &amp; Security</text>
  </g>
</svg>