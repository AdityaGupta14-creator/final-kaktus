<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

  <!-- AXIS LINES (Thin clean red lines matching Airbnb reference) -->
  <line x1="160" y1="250" x2="720" y2="250" stroke="#f43f5e" stroke-width="1.5"/>
  <line x1="440" y1="60" x2="440" y2="440" stroke="#f43f5e" stroke-width="1.5"/>

  <!-- AXIS LABELS (Clean, regular/medium weight, not too bold) -->
  <text x="440" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#2d3748">End-to-End</text>
  <text x="440" y="475" text-anchor="middle" font-size="20" font-weight="600" fill="#2d3748">Fragmented</text>
  <text x="135" y="257" text-anchor="end" font-size="20" font-weight="600" fill="#2d3748">Desktop</text>
  <text x="745" y="257" text-anchor="start" font-size="20" font-weight="600" fill="#2d3748">Browser</text>

  <!-- TOP RIGHT: KAKTUS (YOU) -->
  <g transform="translate(620, 140)">
    <g transform="translate(-14, 0)">
      <!-- Clean official cactus mark -->
      <g stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M-22 10 V-10" />
        <path d="M-22 0 H-28 A3 3 0 0 1 -31 -3 V-6" />
        <path d="M-22 -4 H-16 A3 3 0 0 0 -13 -7 V-10" />
      </g>
      <text x="0" y="4" font-size="24" font-weight="700" fill="#16a34a" letter-spacing="-0.3">Kaktus</text>
    </g>
    <text x="18" y="28" text-anchor="middle" font-size="13" font-weight="500" fill="#718096">You</text>
  </g>

  <!-- TOP LEFT: PROTEUS -->
  <g transform="translate(300, 160)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#4a5568" stroke-width="1.5"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="-5,3 0,8 5,3" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="34" text-anchor="middle" font-size="15" font-weight="500" fill="#4a5568">Proteus</text>
  </g>

  <!-- BOTTOM LEFT: ALTIUM -->
  <g transform="translate(250, 350)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#4a5568" stroke-width="1.5"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="-5,3 0,8 5,3" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="34" text-anchor="middle" font-size="15" font-weight="500" fill="#4a5568">Altium</text>
  </g>

  <!-- BOTTOM RIGHT: WOKWI -->
  <g transform="translate(560, 340)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#4a5568" stroke-width="1.5"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="-5,3 0,8 5,3" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="34" text-anchor="middle" font-size="15" font-weight="500" fill="#4a5568">Wokwi</text>
  </g>

</svg>