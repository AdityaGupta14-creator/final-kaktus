<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#16a34a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- CENTER AXES (Red/Coral like Airbnb reference, thin and clean) -->
  <line x1="180" y1="270" x2="780" y2="270" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  <line x1="480" y1="70" x2="480" y2="470" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>

  <!-- AXIS LABELS (Super minimal typography) -->
  <!-- Top: End-to-End Workflow -->
  <text x="480" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#27272a" letter-spacing="-0.3">End-to-End Workflow</text>
  <text x="480" y="62" text-anchor="middle" font-size="12" font-weight="500" fill="#71717a">Schematic + Code + Flash</text>

  <!-- Bottom: Fragmented Tools -->
  <text x="480" y="500" text-anchor="middle" font-size="20" font-weight="700" fill="#27272a" letter-spacing="-0.3">Fragmented Tools</text>
  <text x="480" y="518" text-anchor="middle" font-size="12" font-weight="500" fill="#71717a">Single-Silo Only (Code or PCB)</text>

  <!-- Left: Heavy Desktop -->
  <text x="140" y="266" text-anchor="end" font-size="20" font-weight="700" fill="#27272a" letter-spacing="-0.3">Heavy Desktop</text>
  <text x="140" y="288" text-anchor="end" font-size="14" font-weight="600" fill="#71717a">Driver Setup</text>

  <!-- Right: Browser-Native -->
  <text x="820" y="266" text-anchor="start" font-size="20" font-weight="700" fill="#27272a" letter-spacing="-0.3">Browser-Native</text>
  <text x="820" y="288" text-anchor="start" font-size="14" font-weight="600" fill="#71717a">Zero Install</text>


  <!-- ========================================== -->
  <!-- QUADRANT 1: TOP-RIGHT (KAKTUS - THE WINNER)-->
  <!-- ========================================== -->
  <g transform="translate(680, 150)">
    <!-- Kaktus Brand Icon + Name -->
    <g transform="translate(0, 0)">
      <!-- Cactus Logo SVG -->
      <path d="M-68 -6 C-68 -12 -63 -16 -57 -16 C-51 -16 -46 -12 -46 -6 L-46 14 C-46 17 -48 19 -51 19 L-63 19 C-66 19 -68 17 -68 14 Z" fill="#16a34a"/>
      <path d="M-78 0 C-82 0 -85 3 -85 7 L-85 10 C-85 13 -82 15 -78 15 L-68 15 L-68 9 L-78 9 L-78 7 C-78 6 -77 5 -76 5 L-76 0 Z" fill="#16a34a"/>
      <path d="M-36 -3 C-32 -3 -29 0 -29 4 L-29 7 C-29 10 -32 12 -36 12 L-46 12 L-46 6 L-36 6 L-36 4 C-36 3 -37 2 -38 2 L-38 -3 Z" fill="#16a34a"/>
      
      <!-- Brand Name -->
      <text x="-20" y="10" font-size="26" font-weight="800" fill="#16a34a" letter-spacing="-0.5">Kaktus</text>
    </g>
    <!-- "You" subtitle matching Airbnb -->
    <text x="0" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#71717a">You</text>
  </g>


  <!-- ========================================== -->
  <!-- QUADRANT 2: TOP-LEFT (PROTEUS / KEIL)       -->
  <!-- ========================================== -->
  <g transform="translate(330, 170)">
    <!-- Competitor Circle Icon matching Airbnb -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#27272a" stroke-width="1.8"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#27272a" stroke-width="1.8" stroke-linecap="round"/>
    <polyline points="-5,3 0,8 5,3" fill="none" stroke="#27272a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#3f3f46">Proteus / Keil</text>
    <text x="0" y="48" text-anchor="middle" font-size="11" font-weight="400" fill="#a1a1aa">$4,000+ Legacy Windows</text>
  </g>


  <!-- ========================================== -->
  <!-- QUADRANT 3: BOTTOM-LEFT (ALTIUM / ARDUINO)  -->
  <!-- ========================================== -->
  <g transform="translate(290, 370)">
    <!-- Competitor Circle Icon matching Airbnb -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#27272a" stroke-width="1.8"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#27272a" stroke-width="1.8" stroke-linecap="round"/>
    <polyline points="-5,3 0,8 5,3" fill="none" stroke="#27272a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#3f3f46">Altium / Arduino IDE</text>
    <text x="0" y="48" text-anchor="middle" font-size="11" font-weight="400" fill="#a1a1aa">Isolated Desktop Tools</text>
  </g>


  <!-- ========================================== -->
  <!-- QUADRANT 4: BOTTOM-RIGHT (WOKWI / TINKERCAD)-->
  <!-- ========================================== -->
  <g transform="translate(620, 360)">
    <!-- Competitor Circle Icon matching Airbnb -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#27272a" stroke-width="1.8"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#27272a" stroke-width="1.8" stroke-linecap="round"/>
    <polyline points="-5,3 0,8 5,3" fill="none" stroke="#27272a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#3f3f46">Wokwi / Tinkercad</text>
    <text x="0" y="48" text-anchor="middle" font-size="11" font-weight="400" fill="#a1a1aa">Sim Only · No Rules/USB</text>
  </g>
</svg>